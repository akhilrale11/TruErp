spring.application.name=TradeAI

# Server Configuration
server.port=8080

# Market Data Mode Configuration (LIVE or SIMULATION)
app.data-mode=LIVE

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:tradeaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring AI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
